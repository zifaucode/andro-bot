<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOT-ANDRO - Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary-accent: #3b82f6;
            --success-accent: #10b981;
            --danger-accent: #ef4444;
            --warning-accent: #f59e0b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.1) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(16, 185, 129, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f8fafc;
            min-height: 100vh;
        }

        .navbar-custom {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
        }

        .stats-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 24px;
            height: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stats-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .icon-circle {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            margin-bottom: 16px;
        }

        .bg-primary-soft { background: rgba(59, 130, 246, 0.2); color: var(--primary-accent); }
        .bg-success-soft { background: rgba(16, 185, 129, 0.2); color: var(--success-accent); }
        .bg-danger-soft { background: rgba(239, 68, 68, 0.2); color: var(--danger-accent); }
        .bg-warning-soft { background: rgba(245, 158, 11, 0.2); color: var(--warning-accent); }

        .btn-action {
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary-accent), #2563eb);
            border: none;
            color: white;
        }
        .btn-primary-custom:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-danger-custom {
            background: linear-gradient(135deg, var(--danger-accent), #dc2626);
            border: none;
            color: white;
        }
        .btn-danger-custom:hover {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .table-custom {
            color: #f8fafc;
        }
        .table-custom th {
            border-bottom: 2px solid var(--glass-border);
            color: #94a3b8;
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .table-custom td {
            border-bottom: 1px solid var(--glass-border);
            vertical-align: middle;
            font-size: 0.95rem;
        }

        .log-container {
            background: #000;
            border-radius: 12px;
            padding: 16px;
            height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #10b981;
            border: 1px solid var(--glass-border);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="fa-brands fa-android text-success me-2 fs-3"></i>
                <span class="fw-bold fs-4" style="background: linear-gradient(90deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">BOT-ANDRO</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="/dashboard"><i class="fa-solid fa-gauge me-1"></i> Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/recorder"><i class="fa-solid fa-video me-1"></i> Macro Recorder</a></li>
                    <li class="nav-item"><a class="nav-link" href="/settings"><i class="fa-solid fa-gear me-1"></i> Settings</a></li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <div id="connectionStatus" class="status-badge bg-warning-soft"><div class="status-dot"></div> Checking...</div>
                    <a href="/logout" class="btn btn-outline-danger btn-sm rounded-circle"><i class="fa-solid fa-power-off"></i></a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4 py-4">
        
        <!-- Controls & Metrics row -->
        <div class="row g-4 mb-4">
            <!-- Bot Control Panel -->
            <div class="col-xl-4 col-lg-6">
                <div class="stats-card text-center d-flex flex-column align-items-center justify-content-center">
                    <h5 class="mb-4 text-muted">Bot System Control</h5>
                    <div class="d-flex gap-3 justify-content-center w-100 mb-3">
                        <button class="btn btn-action btn-primary-custom flex-grow-1" onclick="startBotWorker()" id="btnStartBot">
                            <i class="fa-solid fa-play"></i> Start Bot
                        </button>
                        <button class="btn btn-action btn-danger-custom flex-grow-1" onclick="stopBotWorker()" id="btnStopBot">
                            <i class="fa-solid fa-stop"></i> Stop Bot
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="col-xl-2 col-md-6">
                <div class="stats-card">
                    <div class="icon-circle bg-primary-soft"><i class="fa-solid fa-server"></i></div>
                    <h3 class="fw-bold mb-1" id="fastapiStatus">Online</h3>
                    <p class="text-muted mb-0 small text-uppercase fw-semibold">FastAPI Server</p>
                </div>
            </div>

            <div class="col-xl-2 col-md-6">
                <div class="stats-card">
                    <div class="icon-circle bg-success-soft"><i class="fa-brands fa-android"></i></div>
                    <h3 class="fw-bold mb-1" id="adbCount">-</h3>
                    <p class="text-muted mb-0 small text-uppercase fw-semibold">ADB Connected</p>
                </div>
            </div>

            <div class="col-xl-4 col-lg-12">
                <div class="stats-card">
                    <div class="icon-circle bg-warning-soft"><i class="fa-solid fa-bolt"></i></div>
                    <p class="text-muted mb-1 small text-uppercase fw-semibold">Cloudflare Tunnel URL</p>
                    <div class="d-flex align-items-center gap-2 bg-dark rounded p-2" style="border: 1px solid var(--glass-border)">
                        <input type="text" class="form-control bg-transparent border-0 text-white shadow-none p-0" id="tunnelUrl" readonly value="Loading...">
                        <button class="btn btn-sm btn-outline-secondary" onclick="copyTunnel()">Copy</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Job List -->
            <div class="col-lg-8">
                <div class="stats-card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
                        <h5 class="mb-0 fw-bold"><i class="fa-solid fa-list-check text-primary me-2"></i> Recent Transactions</h5>
                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-danger d-none" id="btnDeleteSelected" onclick="deleteSelectedJobs()"><i class="fa-solid fa-trash-can"></i> Delete Selected</button>
                            <button class="btn btn-sm btn-outline-danger" onclick="clearAllJobs()"><i class="fa-solid fa-trash-can"></i> Delete All</button>
                            <button class="btn btn-sm btn-outline-secondary" onclick="fetchJobs()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-custom table-hover align-middle">
                            <thead>
                                <tr>
                                    <th style="width: 40px;"><input type="checkbox" class="form-check-input" id="checkAll" onclick="toggleCheckAll()"></th>
                                    <th>TXN ID</th>
                                    <th>Status</th>
                                    <th>Updated</th>
                                    <th class="text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody id="jobsTable">
                                <tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Macro Status / Logs -->
            <div class="col-lg-4">
                <div class="stats-card p-4">
                    <h5 class="mb-4 fw-bold"><i class="fa-solid fa-terminal text-success me-2"></i> System Logs</h5>
                    <div class="log-container" id="logContainer">
                        <div class="text-muted">No recent logs...</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal Detail -->
    <div class="modal fade" id="detailModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content text-white" style="background:#0f172a; border:1px solid rgba(255,255,255,0.1);">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fw-bold"><i class="fa-solid fa-circle-info text-primary me-2"></i> Transaction Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-3">
                    <div class="mb-2"><span class="badge bg-secondary" id="modalTxnId"></span></div>
                    <div class="bg-dark p-3 rounded" style="border: 1px solid rgba(255,255,255,0.05); font-family: monospace; font-size: 13px; max-height: 400px; overflow-y: auto; color: #a5f3fc; white-space: pre-wrap;" id="modalDetailContent"></div>
                </div>
                <div class="modal-footer border-top-0 pt-0">
                    <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function fetchSystemData() {
            try {
                // Fetch devices
                const devRes = await fetch('/api/devices');
                if(devRes.ok) {
                    const devData = await devRes.json();
                    document.getElementById('adbCount').innerText = devData.total || 0;
                    
                    const badge = document.getElementById('connectionStatus');
                    if(devData.total > 0) {
                        badge.className = 'status-badge bg-success-soft';
                        badge.innerHTML = '<div class="status-dot"></div> System Ready';
                    } else {
                        badge.className = 'status-badge bg-danger-soft';
                        badge.innerHTML = '<div class="status-dot"></div> No Device (Cek Setup)';
                    }
                }

                // Fetch Tunnel
                const tunRes = await fetch('/api/tunnel-url');
                if(tunRes.ok) {
                    const tunData = await tunRes.json();
                    if(tunData.url) {
                        document.getElementById('tunnelUrl').value = tunData.url;
                    } else {
                        document.getElementById('tunnelUrl').value = 'Tunnel not active';
                    }
                }
                
                // Fetch Jobs
                fetchJobs();

            } catch(e) {
                console.error(e);
            }
        }

        async function fetchJobs() {
            try {
                const res = await fetch('/api/statuses');
                if(!res.ok) return;
                const data = await res.json();
                
                const tbody = document.getElementById('jobsTable');
                tbody.innerHTML = '';
                
                const entries = Object.entries(data);
                if(entries.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Belum ada transaksi</td></tr>';
                    document.getElementById('checkAll').checked = false;
                    updateDeleteBtn();
                    return;
                }

                // Sort descending based on updated_at
                entries.sort((a, b) => new Date(b[1].updated_at) - new Date(a[1].updated_at));

                entries.forEach(([txnId, job]) => {
                    let badgeClass = 'bg-secondary';
                    if (job.status === 'success') badgeClass = 'bg-success';
                    else if (job.status === 'failed' || job.status === 'error') badgeClass = 'bg-danger';
                    else if (job.status === 'running') badgeClass = 'bg-primary';
                    else if (job.status === 'queued') badgeClass = 'bg-warning text-dark';
                    
                    const safeDetail = (job.detail || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/\n/g, '\\n');

                    const row = `<tr>
                        <td><input type="checkbox" class="form-check-input row-checkbox" value="${txnId}" onchange="updateDeleteBtn()"></td>
                        <td class="fw-medium text-break" style="max-width:150px;">${txnId}</td>
                        <td><span class="badge ${badgeClass}">${job.status}</span></td>
                        <td class="small text-muted">${new Date(job.updated_at).toLocaleString()}</td>
                        <td class="text-end text-nowrap">
                            <button class="btn btn-sm btn-info text-white" onclick="showJobDetail('${txnId}', '${safeDetail}')" title="Lihat Detail"><i class="fa-solid fa-eye"></i></button>
                            <button class="btn btn-sm btn-danger" onclick="deleteJob('${txnId}')" title="Hapus"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>`;
                    tbody.insertAdjacentHTML('beforeend', row);
                });
                updateDeleteBtn();
            } catch(e) {
                console.error(e);
            }
        }

        // Functions for Checkboxes & Deletion
        function toggleCheckAll() {
            const isChecked = document.getElementById('checkAll').checked;
            const checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = isChecked);
            updateDeleteBtn();
        }

        function updateDeleteBtn() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            const btnDelSelected = document.getElementById('btnDeleteSelected');
            if (checkedBoxes.length > 0) {
                btnDelSelected.classList.remove('d-none');
                btnDelSelected.innerHTML = `<i class="fa-solid fa-trash-can"></i> Del Selected (${checkedBoxes.length})`;
            } else {
                btnDelSelected.classList.add('d-none');
                document.getElementById('checkAll').checked = false;
            }
        }

        async function deleteJob(txnId) {
            if(!confirm(`Hapus transaksi ${txnId}?`)) return;
            try {
                await fetch(`/api/statuses/${txnId}`, { method: 'DELETE' });
                fetchJobs();
            } catch(e) { alert("Error: " + e.message); }
        }

        async function deleteSelectedJobs() {
            const checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if(!confirm(`Hapus ${checkedBoxes.length} transaksi yang dipilih?`)) return;
            
            for(let cb of checkedBoxes) {
                try {
                    await fetch(`/api/statuses/${cb.value}`, { method: 'DELETE' });
                } catch(e) { console.error(e); }
            }
            fetchJobs();
        }

        async function clearAllJobs() {
            if(!confirm("Yakin ingin menghapus SELURUH riwayat transaksi?")) return;
            try {
                await fetch(`/api/statuses`, { method: 'DELETE' });
                fetchJobs();
            } catch(e) { alert("Error: " + e.message); }
        }

        function showJobDetail(txnId, detailText) {
            document.getElementById('modalTxnId').textContent = "TXN: " + txnId;
            document.getElementById('modalDetailContent').textContent = detailText;
            const modal = new bootstrap.Modal(document.getElementById('detailModal'));
            modal.show();
        }

        function copyTunnel() {
            const el = document.getElementById('tunnelUrl');
            el.select();
            document.execCommand('copy');
        }

        async function startBotWorker() {
            const btn = document.getElementById('btnStartBot');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Starting...';
            btn.disabled = true;

            try {
                // Must pass web=1 to bypass API Key requirement with session
                const res = await fetch('/api/system/bot/start?web=1', { method: 'POST' });
                const json = await res.json();
                appendLog(json.message);
            } catch(e) {
                appendLog("Error calling start bot: " + e.message);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-play"></i> Start Bot';
                btn.disabled = false;
            }
        }

        async function stopBotWorker() {
            const btn = document.getElementById('btnStopBot');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Stopping...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/system/bot/stop?web=1', { method: 'POST' });
                const json = await res.json();
                appendLog(json.message);
            } catch(e) {
                appendLog("Error calling stop bot: " + e.message);
            } finally {
                btn.innerHTML = '<i class="fa-solid fa-stop"></i> Stop Bot';
                btn.disabled = false;
            }
        }

        function appendLog(msg) {
            const container = document.getElementById('logContainer');
            // Remove 'No recent logs...' default msg
            if (container.firstElementChild && container.firstElementChild.classList.contains('text-muted')) {
                container.innerHTML = '';
            }
            const time = new Date().toLocaleTimeString();
            container.innerHTML += `<div>[${time}] ${msg}</div>`;
            container.scrollTop = container.scrollHeight;
        }

        // Init
        fetchSystemData();
        setInterval(fetchJobs, 5000); // Poll jobs every 5s
    </script>
</body>
</html>
